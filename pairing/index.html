
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GESTON MD | PAIRING HUB</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #6366f1;
            --accent: #00ffcc;
            --geston: #ff3366;
            --bg: #030712;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- LOADER (matches After-Frk exactly) --- */
        #loader {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .loader-content {
            position: relative;
            width: 100px;
            height: 100px;
        }

        .loader-circle {
            position: absolute;
            inset: 0;
            border: 2px solid transparent;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loader-circle:nth-child(2) {
            inset: 10px;
            border-top-color: var(--geston);
            animation-duration: 1.5s;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loader-text {
            margin-top: 30px;
            font-size: 10px;
            letter-spacing: 5px;
            color: var(--accent);
            font-weight: 800;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse { from { opacity: 0.3; } to { opacity: 1; } }

        /* --- BACKGROUND (matches After-Frk exactly) --- */
        .canvas-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(0, 255, 204, 0.05) 0%, transparent 40%);
        }

        /* Atom rings (preserved from original pairing page) */
        .atom-container {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .atom-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(99, 102, 241, 0.12);
            animation: rotate 25s linear infinite;
        }

        .atom-ring:nth-child(1) { width: 400px; height: 400px; }
        .atom-ring:nth-child(2) { width: 600px; height: 600px; animation-duration: 35s; border-color: rgba(0, 255, 204, 0.07); }

        @keyframes rotate { 100% { transform: rotate(360deg); } }

        /* --- NAV --- */
        nav {
            width: 100%;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(3, 7, 18, 0.5);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .nav-logo {
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: -1px;
            color: var(--accent);
        }

        .nav-home {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 100px;
            transition: all 0.3s;
        }

        .nav-home:hover {
            color: var(--accent);
            border-color: rgba(0, 255, 204, 0.4);
        }

        /* --- MAIN CONTENT --- */
        .main-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            width: 100%;
        }

        .app-shell {
            width: 90%;
            max-width: 450px;
            animation: springIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) backwards 0.2s;
        }

        @keyframes springIn {
            0% { opacity: 0; transform: scale(0.9) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 35px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 40px 100px rgba(0,0,0,0.6);
        }

        .logo-box {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            margin: 0 auto 25px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.4);
        }

        .glass-card h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(to bottom, #fff 30%, rgba(255,255,255,0.6));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glass-card p.desc {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 35px;
        }

        /* --- METHOD BUTTONS --- */
        .button-stack {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .method-btn {
            width: 100%;
            padding: 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .method-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
            transform: translateX(5px);
        }

        .method-btn .btn-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .method-btn .btn-icon {
            font-size: 20px;
            color: var(--primary);
        }

        .method-btn .arrow {
            color: #475569;
            font-size: 14px;
        }

        /* --- NODE SELECTION MODAL --- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(3, 7, 18, 0.92);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            width: 90%;
            max-width: 400px;
            background: #0d1526;
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 32px;
            transform: scale(0.92);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-title {
            font-size: 20px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 6px;
        }

        .modal-sub {
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
            margin-bottom: 20px;
        }

        .server-list {
            display: grid;
            gap: 12px;
        }

        .server-opt {
            padding: 18px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.2s;
        }

        .server-opt:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        .server-opt i {
            font-size: 18px;
            color: var(--accent);
        }

        .server-opt:hover i { color: #fff; }

        .server-opt .server-name {
            font-weight: 700;
            font-size: 14px;
        }

        .server-opt .server-sub {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 2px;
        }

        .modal-cancel {
            margin-top: 18px;
            width: 100%;
            background: transparent;
            border: none;
            color: #475569;
            font-size: 12px;
            cursor: pointer;
            letter-spacing: 2px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            padding: 8px;
            transition: color 0.2s;
        }

        .modal-cancel:hover { color: #94a3b8; }

        /* --- FOOTER --- */
        footer {
            text-align: center;
            padding: 40px 20px;
            color: #475569;
            font-size: 12px;
            letter-spacing: 2px;
            width: 100%;
            border-top: 1px solid var(--border);
        }

        /* --- ANIMATIONS --- */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- MOBILE --- */
        @media (max-width: 500px) {
            .glass-card { padding: 30px 24px; border-radius: 28px; }
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="loader-content">
            <div class="loader-circle"></div>
            <div class="loader-circle"></div>
        </div>
        <div class="loader-text">ESTABLISHING UPLINK</div>
    </div>

    <div class="canvas-bg"></div>
    <div class="atom-container">
        <div class="atom-ring"></div>
        <div class="atom-ring"></div>
    </div>

    <nav>
        <div class="nav-logo">GESTON MD</div>
        <a href="/" class="nav-home"><i class="fas fa-arrow-left"></i> HOME</a>
    </nav>

    <div class="main-wrap">
        <div class="app-shell">
            <div class="glass-card">
                <div class="logo-box"><i class="fas fa-link"></i></div>
                <h1>Select Method</h1>
                <p class="desc">How would you like to link your WhatsApp session?</p>

                <div class="button-stack">
                    <button class="method-btn" onclick="openNode('pair')">
                        <span class="btn-left">
                            <i class="fas fa-keyboard btn-icon"></i>
                            Pairing Code
                        </span>
                        <i class="fas fa-chevron-right arrow"></i>
                    </button>
                    <button class="method-btn" onclick="openNode('qr')">
                        <span class="btn-left">
                            <i class="fas fa-qrcode btn-icon"></i>
                            QR Scan
                        </span>
                        <i class="fas fa-chevron-right arrow"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer>© 2026 GESTON TECH &bull; ALL RIGHTS RESERVED</footer>

    <!-- NODE SELECTION MODAL -->
    <div class="modal-overlay" id="nodeModal" onclick="closeNode(event)">
        <div class="modal-content">
            <div class="modal-title">Select a Server Node</div>
            <div class="modal-sub">Choose any server to continue.</div>
            <div class="server-list">
                <div class="server-opt" onclick="go('node1')">
                    <i class="fas fa-server"></i>
                    <div>
                        <div class="server-name">Node Server 1</div>
                        <div class="server-sub">Primary Server (Render)</div>
                    </div>
                </div>
                <div class="server-opt" onclick="go('node2')">
                    <i class="fas fa-server"></i>
                    <div>
                        <div class="server-name">Node Server 2</div>
                        <div class="server-sub">Secondary Server (Render)</div>
                    </div>
                </div>
            </div>
            <button class="modal-cancel" onclick="closeNode(null)">CANCEL</button>
        </div>
    </div>

    <script>
        // Loader — same slide-up exit as After-Frk
        window.addEventListener('load', () => {
            const loader = document.getElementById('loader');
            setTimeout(() => {
                loader.style.transform = 'translateY(-100%)';
                setTimeout(() => loader.style.display = 'none', 800);
            }, 1000);
        });

        let currentType = '';

        function openNode(type) {
            currentType = type;
            const modal = document.getElementById('nodeModal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
        }

        function closeNode(e) {
            if (!e || e.target.id === 'nodeModal') {
                const modal = document.getElementById('nodeModal');
                modal.classList.remove('active');
                setTimeout(() => modal.style.display = 'none', 300);
            }
        }

        function go(node) {
            const loader = document.getElementById('loader');
            loader.style.display = 'flex';
            loader.style.transform = 'translateY(0)';

            const endpoints = {
                node1: 'https://pairing1.gestonmd.tech',
                node2: 'https://pairing2.gestonmd.tech'
            };

            setTimeout(() => {
                window.location.href = `${endpoints[node]}/${currentType}`;
            }, 800);
        }
    </script>
</body>
</html>
